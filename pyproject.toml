[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "himsetu"
version = "0.3.0"
description = "HIMSETU — AI-Based Subsurface Lunar Ice Detection & Mission Planning System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HIMSETU Team"}
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "colorama>=0.4.6,<1.0",
    "rich>=13.0.0,<14.0",
    # M2 — Lunar Data Ingestion
    "rasterio>=1.3,<2.0",
    "numpy>=1.24,<3.0",
    "pillow>=10.0,<12.0",
    # M3 — Backend APIs & Data Processing
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0",
]
science = [
    "netcdf4>=1.6,<2.0",
    "h5py>=3.9,<4.0",
]

[project.scripts]
himsetu = "himsetu.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["himsetu*"]
